<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블오더 관리자</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 로그인 화면 -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <h1 class="login-title">관리자 로그인</h1>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="store-code">매장 코드</label>
                    <input type="text" id="store-code" placeholder="매장 코드" required>
                </div>
                <div class="form-group">
                    <label for="username">사용자명</label>
                    <input type="text" id="username" placeholder="사용자명" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">로그인</button>
                <p id="login-error" class="error-message" hidden></p>
            </form>
        </div>
    </div>

    <!-- 메인 화면 -->
    <div id="main-screen" class="screen" hidden>
        <header class="admin-header">
            <div class="header-left">
                <h1 class="header-title">테이블오더 관리</h1>
                <span id="store-name" class="store-name"></span>
            </div>
            <button id="btn-logout" class="btn btn-secondary btn-sm">로그아웃</button>
        </header>

        <nav class="admin-nav">
            <button class="admin-nav-btn active" data-section="dashboard">주문 대시보드</button>
            <button class="admin-nav-btn" data-section="tables">테이블 관리</button>
            <button class="admin-nav-btn" data-section="menus">메뉴 관리</button>
        </nav>

        <!-- 주문 대시보드 -->
        <section id="section-dashboard" class="section active">
            <div class="section-header">
                <h2>실시간 주문</h2>
                <span id="sse-status" class="sse-status">연결 중...</span>
            </div>
            <div id="order-grid" class="order-grid"></div>
            <div id="dashboard-empty" class="empty-state"><p>주문이 없습니다</p></div>
        </section>

        <!-- 테이블 관리 -->
        <section id="section-tables" class="section">
            <div class="section-header">
                <h2>테이블 관리</h2>
                <button id="btn-add-table" class="btn btn-primary btn-sm">테이블 추가</button>
            </div>
            <div id="table-grid" class="table-grid"></div>
        </section>

        <!-- 메뉴 관리 -->
        <section id="section-menus" class="section">
            <div class="section-header">
                <h2>메뉴 관리</h2>
                <button id="btn-add-menu" class="btn btn-primary btn-sm">메뉴 추가</button>
            </div>
            <div id="category-tabs" class="category-tabs"></div>
            <div id="admin-menu-list" class="admin-menu-list"></div>
        </section>
    </div>

    <!-- 주문 상세 모달 -->
    <div id="order-detail-modal" class="modal" hidden>
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3 id="detail-title">주문 상세</h3>
                <button id="btn-close-detail" class="btn-close" aria-label="닫기">✕</button>
            </div>
            <div id="detail-body" class="modal-body"></div>
        </div>
    </div>

    <!-- 확인 모달 -->
    <div id="confirm-modal" class="modal" hidden>
        <div class="modal-content">
            <p id="confirm-message"></p>
            <div class="modal-actions">
                <button id="btn-confirm-cancel" class="btn btn-secondary">취소</button>
                <button id="btn-confirm-ok" class="btn btn-danger">확인</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
