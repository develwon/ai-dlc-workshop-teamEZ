<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블오더</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 로그인 화면 -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <h1 class="login-title">테이블오더</h1>
            <p class="login-subtitle">테이블 정보를 입력해주세요</p>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="store-code">매장 코드</label>
                    <input type="text" id="store-code" placeholder="매장 코드 입력" required>
                </div>
                <div class="form-group">
                    <label for="table-number">테이블 번호</label>
                    <input type="number" id="table-number" placeholder="테이블 번호 입력" required min="1">
                </div>
                <div class="form-group">
                    <label for="table-password">비밀번호</label>
                    <input type="password" id="table-password" placeholder="비밀번호 입력" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">로그인</button>
                <p id="login-error" class="error-message" hidden></p>
            </form>
        </div>
    </div>

    <!-- 메인 화면 (메뉴/장바구니/주문내역) -->
    <div id="main-screen" class="screen" hidden>
        <!-- 상단 헤더 -->
        <header class="header">
            <span id="header-table-info" class="header-info"></span>
            <nav class="header-nav">
                <button class="nav-btn active" data-tab="menu">메뉴</button>
                <button class="nav-btn" data-tab="cart">장바구니 <span id="cart-badge" class="badge" hidden>0</span></button>
                <button class="nav-btn" data-tab="orders">주문내역</button>
            </nav>
        </header>

        <!-- 메뉴 탭 -->
        <div id="tab-menu" class="tab-content active">
            <div class="category-bar" id="category-bar"></div>
            <div class="menu-grid" id="menu-grid"></div>
        </div>

        <!-- 장바구니 탭 -->
        <div id="tab-cart" class="tab-content">
            <div id="cart-items" class="cart-items"></div>
            <div id="cart-empty" class="empty-state">
                <p>장바구니가 비어있습니다</p>
            </div>
            <div id="cart-footer" class="cart-footer" hidden>
                <div class="cart-total">
                    <span>총 금액</span>
                    <span id="cart-total-amount" class="total-amount">0원</span>
                </div>
                <div class="cart-actions">
                    <button id="btn-clear-cart" class="btn btn-secondary">비우기</button>
                    <button id="btn-order" class="btn btn-primary">주문하기</button>
                </div>
            </div>
        </div>

        <!-- 주문내역 탭 -->
        <div id="tab-orders" class="tab-content">
            <div id="order-list" class="order-list"></div>
            <div id="orders-empty" class="empty-state">
                <p>주문 내역이 없습니다</p>
            </div>
        </div>
    </div>

    <!-- 주문 성공 모달 -->
    <div id="order-success-modal" class="modal" hidden>
        <div class="modal-content">
            <div class="modal-icon">✅</div>
            <h2>주문이 완료되었습니다</h2>
            <p>주문번호: <span id="success-order-number"></span></p>
            <p class="modal-redirect">잠시 후 메뉴 화면으로 이동합니다...</p>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
