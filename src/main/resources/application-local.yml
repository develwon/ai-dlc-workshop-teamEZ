spring:
  datasource:
    url: jdbc:h2:mem:tableorder;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

jwt:
  secret: bG9jYWxEZXZlbG9wbWVudFNlY3JldEtleUZvclRlc3RpbmdPbmx5MTIzNDU2Nzg5MA==
  expiration: 57600000
